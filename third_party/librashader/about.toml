# cargo-about config for build-windows.sh and notices-macos.sh: the licences
# of every crate linked into the x86-64 Windows librashader.dll (see
# THIRDPARTY.txt in the zip) or upstream's macOS librashader.dylib
# (THIRDPARTY-macos.txt here). Build and dev dependencies are not linked.
# notices-macos.sh overrides targets with the two macOS triples.
accepted = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "Zlib", "Unlicense", "0BSD", "CC0-1.0", "MIT-0",
    "MPL-2.0", "Unicode-3.0",
    # Last, so it changes no choice above: libloading (via ash) is in the
    # macOS graph only (notices-macos.sh).
    "ISC",
]
targets = ["x86_64-pc-windows-gnullvm"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
